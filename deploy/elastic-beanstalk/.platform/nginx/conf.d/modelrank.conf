# ModelRank - nginx overrides for Elastic Beanstalk (Docker, Amazon Linux 2023)
#
# The frontend uses the background job endpoints, whose requests are short.
# POST /evaluate still runs a whole evaluation inside one request for direct
# API use, so the proxy waits up to 15 minutes instead of nginx's default 60s.
# (CloudFront in front of the environment still limits requests to its own
# origin timeout.)

proxy_connect_timeout 60s;
proxy_send_timeout 900s;
proxy_read_timeout 900s;
send_timeout 900s;

# Requests are short JSON bodies
client_max_body_size 1m;

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: modelrank-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: modelrank-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
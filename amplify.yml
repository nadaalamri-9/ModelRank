version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Vite 8 needs Node 20.19+ or 22.12+
            - nvm install 22
            - nvm use 22
            # Without the backend URL the build would fall back to localhost
            - 'if [ -z "$VITE_API_URL" ]; then echo "VITE_API_URL is not set" && exit 1; fi'
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
